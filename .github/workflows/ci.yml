name: Front CI

on:
  push:
    branches: [ 'main', 'release/**', 'pre-release/**' ]
  pull_request:
    branches: [ 'main', 'release/**', 'pre-release/**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
  node-version: 24

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          cache-dependency-path: package-lock.json
          node-version: ${{ env.node-version }}

      - name: Authenticate to Nexus npm registry
        uses: mdblp/.github/.github/actions/nexus-npm-auth@main
        with:
          username: ${{ secrets.NEXUS_RO_USERNAME }}
          password: ${{ secrets.NEXUS_RO_PASSWORD }}

      - name: Install npm dependencies
        run: |
          npm run security-checks
          npm ci

      - name: Lint + test locales
        run: |
          npm run lint
          npm run test-locales

  setup:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          cache-dependency-path: package-lock.json
          node-version: ${{ env.node-version }}

      - name: Restore dependencies and built packages
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/medical-domain/dist
            packages/dumb/dist
          key: deps-${{ runner.os }}-${{ env.node-version }}-${{ hashFiles('package-lock.json', 'packages/medical-domain/**', 'packages/dumb/**') }}

      - name: Authenticate to Nexus npm registry
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: mdblp/.github/.github/actions/nexus-npm-auth@main
        with:
          username: ${{ secrets.NEXUS_RO_USERNAME }}
          password: ${{ secrets.NEXUS_RO_PASSWORD }}

      - name: Install npm dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          npm ci
          npm run build-dependencies

  test-lambda:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          cache-dependency-path: package-lock.json
          node-version: ${{ env.node-version }}

      - name: Authenticate to Nexus npm registry
        uses: mdblp/.github/.github/actions/nexus-npm-auth@main
        with:
          username: ${{ secrets.NEXUS_RO_USERNAME }}
          password: ${{ secrets.NEXUS_RO_PASSWORD }}

      - name: Install npm dependencies
        run: |
          npm ci

      - name: Test lambda
        run: npm run test-lambda

      - name: Lint release script
        run: shellcheck cloudfront-dist/deploy.sh

  test-medical:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          cache-dependency-path: package-lock.json
          node-version: ${{ env.node-version }}

      - name: Authenticate to Nexus npm registry
        uses: mdblp/.github/.github/actions/nexus-npm-auth@main
        with:
          username: ${{ secrets.NEXUS_RO_USERNAME }}
          password: ${{ secrets.NEXUS_RO_PASSWORD }}

      - name: Install npm dependencies
        run: |
          npm ci

      - name: Test medical domain
        run: npm run test-medical-domain

  test-dumb:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}

      - name: Restore dependencies and built packages
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/medical-domain/dist
            packages/dumb/dist
          key: deps-${{ runner.os }}-${{ env.node-version }}-${{ hashFiles('package-lock.json', 'packages/medical-domain/**', 'packages/dumb/**') }}
          fail-on-cache-miss: true

      - name: Test dumb
        run: npm run test-dumb

  test-yourloops-unit:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}

      - name: Restore dependencies and built packages
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/medical-domain/dist
            packages/dumb/dist
          key: deps-${{ runner.os }}-${{ env.node-version }}-${{ hashFiles('package-lock.json', 'packages/medical-domain/**', 'packages/dumb/**') }}
          fail-on-cache-miss: true

      - name: Restore Jest cache
        uses: actions/cache@v4
        with:
          path: .jest-cache
          key: jest-${{ github.job }}-${{ hashFiles('package-lock.json', 'babel.config.json') }}-${{ github.sha }}
          restore-keys: |
            jest-${{ github.job }}-${{ hashFiles('package-lock.json', 'babel.config.json') }}-
            jest-${{ github.job }}-

      - name: Test yourloops unit
        run: npm run test-yourloops-unit

  test-yourloops-integration-hcp:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        shard: [ 1, 2, 3 ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}

      - name: Restore dependencies and built packages
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/medical-domain/dist
            packages/dumb/dist
          key: deps-${{ runner.os }}-${{ env.node-version }}-${{ hashFiles('package-lock.json', 'packages/medical-domain/**', 'packages/dumb/**') }}
          fail-on-cache-miss: true

      - name: Restore Jest cache
        uses: actions/cache@v4
        with:
          path: .jest-cache
          key: jest-${{ github.job }}-${{ matrix.shard }}-${{ hashFiles('package-lock.json', 'babel.config.json') }}-${{ github.sha }}
          restore-keys: |
            jest-${{ github.job }}-${{ matrix.shard }}-${{ hashFiles('package-lock.json', 'babel.config.json') }}-
            jest-${{ github.job }}-${{ matrix.shard }}-

      - name: Test yourloops integration hcp (shard ${{ matrix.shard }}/3)
        run: |
          source config/.env.sh
          npm run integration-test-hcp -w yourloops -- --shard=${{ matrix.shard }}/3

  test-yourloops-integration-caregiver:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}

      - name: Restore dependencies and built packages
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/medical-domain/dist
            packages/dumb/dist
          key: deps-${{ runner.os }}-${{ env.node-version }}-${{ hashFiles('package-lock.json', 'packages/medical-domain/**', 'packages/dumb/**') }}
          fail-on-cache-miss: true

      - name: Restore Jest cache
        uses: actions/cache@v4
        with:
          path: .jest-cache
          key: jest-${{ github.job }}-${{ hashFiles('package-lock.json', 'babel.config.json') }}-${{ github.sha }}
          restore-keys: |
            jest-${{ github.job }}-${{ hashFiles('package-lock.json', 'babel.config.json') }}-
            jest-${{ github.job }}-

      - name: Test yourloops integration caregiver
        run: npm run test-yourloops-integration-caregiver

  test-yourloops-integration-patient:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}

      - name: Restore dependencies and built packages
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/medical-domain/dist
            packages/dumb/dist
          key: deps-${{ runner.os }}-${{ env.node-version }}-${{ hashFiles('package-lock.json', 'packages/medical-domain/**', 'packages/dumb/**') }}
          fail-on-cache-miss: true

      - name: Restore Jest cache
        uses: actions/cache@v4
        with:
          path: .jest-cache
          key: jest-${{ github.job }}-${{ hashFiles('package-lock.json', 'babel.config.json') }}-${{ github.sha }}
          restore-keys: |
            jest-${{ github.job }}-${{ hashFiles('package-lock.json', 'babel.config.json') }}-
            jest-${{ github.job }}-

      - name: Test yourloops integration patient
        run: npm run test-yourloops-integration-patient

  test-yourloops-integration-common:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}

      - name: Restore dependencies and built packages
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/medical-domain/dist
            packages/dumb/dist
          key: deps-${{ runner.os }}-${{ env.node-version }}-${{ hashFiles('package-lock.json', 'packages/medical-domain/**', 'packages/dumb/**') }}
          fail-on-cache-miss: true

      - name: Restore Jest cache
        uses: actions/cache@v4
        with:
          path: .jest-cache
          key: jest-${{ github.job }}-${{ hashFiles('package-lock.json', 'babel.config.json') }}-${{ github.sha }}
          restore-keys: |
            jest-${{ github.job }}-${{ hashFiles('package-lock.json', 'babel.config.json') }}-
            jest-${{ github.job }}-

      - name: Test yourloops integration common
        run: npm run test-yourloops-integration-common

  build:
    runs-on: ubuntu-latest
    needs: [ test-lambda, test-dumb, test-medical, test-yourloops-unit, test-yourloops-integration-hcp, test-yourloops-integration-caregiver, test-yourloops-integration-patient, test-yourloops-integration-common ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          cache-dependency-path: package-lock.json
          node-version: ${{ env.node-version }}

      - name: Authenticate to Nexus npm registry
        uses: mdblp/.github/.github/actions/nexus-npm-auth@main
        with:
          username: ${{ secrets.NEXUS_RO_USERNAME }}
          password: ${{ secrets.NEXUS_RO_PASSWORD }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: nice bash build.sh

      - name: Upload yourloops build
        if: github.ref_name == 'main' || startsWith(github.ref_name, 'release/')
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    if: github.ref_name == 'main' || startsWith(github.ref_name, 'release/')
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.changelog-version.outputs.semver }}
    steps:
      - uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: /home/runner/work/blip/blip/dist

      - name: Get yourloops version from changelog
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          docker login "$REGISTRY" \
            -u "$NEXUS_USERNAME" \
            -p "$NEXUS_PASSWORD"

          docker run --rm \
            -v ${{ github.workspace }}:/dblprm/blip/:rw --user 0:0 \
            docker.ci.diabeloop.eu/ci-toolbox:latest \
            sh -c "
              cd blip
              echo \"semver=\$(release-helper get-version)\" > version.env
            "

      - name: Read env file
        id: changelog-version
        uses: cardinalby/export-env-action@v2
        with:
          envFile: 'version.env'
          expand: 'false'
          export: 'false'

      - name: Set short commit sha
        id: short-commit-compute
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:v0.10.6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          aws-access-key-id: ${{ secrets.ECR_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.ECR_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Login to ECR
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ECR_AWS_ACCOUNT_NUMBER }}.dkr.ecr.eu-west-3.amazonaws.com

      - name: Creating new github tag
        uses: rickstaa/action-create-tag@v1
        with:
          tag: v${{ steps.changelog-version.outputs.semver }}-${{ steps.short-commit-compute.outputs.sha_short }}

      - name: Authenticate to Nexus npm registry
        uses: mdblp/.github/.github/actions/nexus-npm-auth@main
        with:
          username: ${{ secrets.NEXUS_RO_USERNAME }}
          password: ${{ secrets.NEXUS_RO_PASSWORD }}

      - name: Build and push blip Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64,linux/amd64
          secrets: |
            nexus_token=${{ env.NEXUS_TOKEN }}
          build-args: |
            APP_VERSION=${{ steps.changelog-version.outputs.semver }}-${{ steps.short-commit-compute.outputs.sha_short }}
          tags: |
            ${{ secrets.ECR_AWS_ACCOUNT_NUMBER }}.dkr.ecr.eu-west-3.amazonaws.com/yourloops/blip:${{ steps.changelog-version.outputs.semver }}-${{ steps.short-commit-compute.outputs.sha_short }}
            ${{ secrets.ECR_AWS_ACCOUNT_NUMBER }}.dkr.ecr.eu-west-3.amazonaws.com/yourloops/blip:${{ steps.changelog-version.outputs.semver }}

  sbom:
    if: github.ref_name == 'main' || startsWith(github.ref_name, 'release/')
    needs: publish
    uses: mdblp/.github/.github/workflows/sbom.yml@main
    with:
      app-name: blip
      language: js
    secrets: inherit
