name: Nexus npm auth
description: Export NEXUS_TOKEN (base64 of user:password) so the _auth line of .npmrc can authenticate against the Nexus npm registry.

inputs:
  username:
    description: Nexus username
    required: true
  password:
    description: Nexus password
    required: true

runs:
  using: composite
  steps:
    - name: Export NEXUS_TOKEN
      shell: bash
      env:
        NEXUS_USERNAME: ${{ inputs.username }}
        NEXUS_PASSWORD: ${{ inputs.password }}
      run: |
        token=$(printf '%s:%s' "$NEXUS_RO_USERNAME" "$NEXUS_RO_PASSWORD" | base64 -w0)
        echo "::add-mask::$token"
        echo "NEXUS_TOKEN=$token" >> "$GITHUB_ENV"
